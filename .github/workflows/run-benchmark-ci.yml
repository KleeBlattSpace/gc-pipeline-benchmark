name: Run benchmark
on:
  push:
    paths: ["scripts/**", "runners/**", "public/benchmark/ground-truth.json", ".github/workflows/run-benchmark-ci.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: run-benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate
      - run: npm run ground-truth
      - run: npm run benchmark
      - run: npm run validate
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: public/benchmark/results.json
          if-no-files-found: warn
