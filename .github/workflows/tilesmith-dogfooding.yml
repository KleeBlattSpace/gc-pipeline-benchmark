name: TileSmith QC dogfooding

on:
  pull_request:
    paths:
      - 'assets/**'
      - '.github/workflows/tilesmith-dogfooding.yml'

concurrency:
  group: tilesmith-dogfooding-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tilesmith-qc:
    name: Score benchmark tiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # upsert the QC report comment on the triggering PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify TileSmith secret availability
        env:
          TILESMITH_API_KEY: ${{ secrets.TILESMITH_API_KEY }}
        run: |
          if [ -n "$TILESMITH_API_KEY" ]; then
            echo "TILESMITH_API_KEY=present"
          else
            # Secrets are not exposed to forked PRs. Report it and let the action emit its
            # documented fork-safe notice instead of hard-failing the required check.
            echo "TILESMITH_API_KEY=missing"
          fi

      - name: Run TileSmith QC
        id: tilesmith
        uses: Kleeblatt-space/tilesmith-actions@feature/tilesmith-qc-implementation
        env:
          INPUT_API_KEY: ${{ secrets.TILESMITH_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-key: ${{ secrets.TILESMITH_API_KEY }}
          paths: 'assets/base/**,assets/hd/**'
          fail-on: never
          max-files: '20'

      - name: Upload TileSmith report and overlays
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tilesmith-qc-report
          path: tilesmith-report/
          if-no-files-found: warn

      - name: Publish outputs
        if: always()
        run: |
          echo "Production: ${{ steps.tilesmith.outputs.production }}"
          echo "Review: ${{ steps.tilesmith.outputs.review }}"
          echo "Reject: ${{ steps.tilesmith.outputs.reject }}"
          echo "Average: ${{ steps.tilesmith.outputs.avg }}"
